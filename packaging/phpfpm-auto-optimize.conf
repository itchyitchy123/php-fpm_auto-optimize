# PHP-FPM Auto Optimizer policy
# CLI arguments override these values. Run a dry run after every policy change.
reserve_percent=20
target_percent=80
worker_mb=64
worker_percentile=75
lookback_hours=48
min_children=5
max_children=75
change_percent=20
max_requests=500
backup_retention=20
overcommit_percent=100
monitor_seconds=0
sample_interval=5
backup_dir=/var/backups/phpfpm-auto-optimize

# Repeat these keys for explicitly managed locations if automatic discovery is
# not appropriate.
# pool_dir=/etc/php/8.3/fpm/pool.d
# log_file=/etc/php/8.3/fpm/pool.d=/var/log/php8.3-fpm.log
# instance=/srv/php/pool.d|/srv/php/sbin/php-fpm|/srv/php/etc/php-fpm.conf|php-custom-fpm.service
