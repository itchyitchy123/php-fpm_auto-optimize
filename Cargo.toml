[package]
name = "fpm-lens"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Explainable, evidence-aware PHP-FPM capacity planner"
license = "MIT"
repository = "https://github.com/itchyitchy123/fpm-lens"
keywords = ["php-fpm", "capacity-planning", "linux", "tui"]
categories = ["command-line-utilities"]

[lib]
name = "fpm_lens"
path = "src/lib.rs"

[[bin]]
name = "fpm-lens"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "1.1"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
format_push_string = "allow"
wildcard_imports = "allow"
