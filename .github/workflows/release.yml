name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - run: cargo test --locked
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - run: |
          cp "target/${{ matrix.target }}/release/fpm-lens" "fpm-lens-${GITHUB_REF_NAME}-${{ matrix.target }}"
          sha256sum "fpm-lens-${GITHUB_REF_NAME}-${{ matrix.target }}" > "fpm-lens-${GITHUB_REF_NAME}-${{ matrix.target }}.sha256"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: fpm-lens-*
