name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - run: cargo test --locked
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - run: |
          asset="fpm-lens-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/fpm-lens" "$asset"
          sha256sum "$asset" > "$asset.sha256"
      - name: Attest release binary provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: fpm-lens-${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            fpm-lens-${{ matrix.target }}
            fpm-lens-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    needs: linux
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: release-assets-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/fpm-lens-*
      - name: Smoke-test published release assets
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$GH_REPOSITORY"
          test -n "$GH_TAG"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cd "$temp_dir"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            asset="fpm-lens-$target"
            url="https://github.com/$GH_REPOSITORY/releases/download/$GH_TAG"
            curl --fail --silent --show-error --location --retry 10 \
              --retry-delay 5 --retry-all-errors -O "$url/$asset" \
              -O "$url/$asset.sha256"
            sha256sum -c "$asset.sha256"
            chmod 0755 "$asset"
            "./$asset" --version
          done
