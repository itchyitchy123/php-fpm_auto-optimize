name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned lint tools
        run: |
          ./tests/install-lint-tools.sh "$RUNNER_TEMP/lint-bin"
          echo "$RUNNER_TEMP/lint-bin" >> "$GITHUB_PATH"
      - name: Verify tag matches program version
        run: test "${GITHUB_REF_NAME#v}" = "$(./phpfpm-auto-optimize --version | awk '{print $2}')"
      - run: sudo env "PATH=$PATH" make dist
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/phpfpm-auto-optimize-*.tar.gz
            dist/SHA256SUMS
